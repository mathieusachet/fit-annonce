<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Annonces Transport — FIT Solutions</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F6F3;
    --surface: #FFFFFF;
    --surface2: #F0EEE9;
    --border: #E2DED7;
    --border-strong: #C8C3BB;
    --text: #1A1916;
    --text-2: #6B6860;
    --text-3: #9E9B95;
    --accent: #1A4ED8;
    --accent-light: #EEF2FF;
    --accent-text: #1E3A8A;
    --green: #166534;
    --green-bg: #DCFCE7;
    --red: #991B1B;
    --red-bg: #FEE2E2;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110;
      --surface: #1C1C1A;
      --surface2: #252523;
      --border: #2E2E2B;
      --border-strong: #404040;
      --text: #F2F0EB;
      --text-2: #A8A49C;
      --text-3: #6B6860;
      --accent: #4F7FFF;
      --accent-light: #1A2340;
      --accent-text: #93B4FF;
      --green: #86EFAC;
      --green-bg: #14532D;
      --red: #FCA5A5;
      --red-bg: #450A0A;
    }

    .date-pick::-webkit-calendar-picker-indicator { filter: invert(1); }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    line-height: 1.5;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .logo {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  .lang-toggle {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2px;
    gap: 2px;
  }

  .lang-btn {
    padding: 4px 12px;
    font-size: 13px;
    border: none;
    background: none;
    border-radius: 16px;
    cursor: pointer;
    color: var(--text-2);
    font-weight: 500;
    transition: all 0.15s;
  }

  .lang-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 14px;
    color: var(--text-2);
    margin-bottom: 2rem;
  }

  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 1.5rem;
  }

  .tab {
    flex: 1;
    padding: 8px;
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: none;
    border-radius: calc(var(--radius) - 2px);
    cursor: pointer;
    color: var(--text-2);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .tab.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .field {
    margin-bottom: 1rem;
  }

  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  input[type="text"], input[type="search"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 127, 255, 0.12);
  }

  textarea { resize: vertical; min-height: 130px; line-height: 1.5; }

  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

  @media (max-width: 480px) {
    .row2, .row3 { grid-template-columns: 1fr; }
    .generate-row { flex-direction: column; align-items: stretch; }
    .generate-row .lang-toggle { align-self: center; }
  }

  .generate-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 1rem;
  }

  .generate-row .btn-primary { margin-top: 0; flex: 1; }

  .ac-wrap { position: relative; }

  .date-wrap { position: relative; }
  .date-wrap input[type="text"] { padding-right: 36px; }

  .date-pick {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    padding: 0;
    margin: 0;
    border: none;
    background: transparent;
    color: transparent;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }

  .date-pick::-webkit-calendar-picker-indicator {
    opacity: 0.55;
    cursor: pointer;
    padding: 0;
  }

  .date-pick::-webkit-calendar-picker-indicator:hover { opacity: 1; }

  .date-pick::-webkit-datetime-edit,
  .date-pick::-webkit-inner-spin-button {
    display: none;
  }

  .ac-list {
    position: absolute;
    top: calc(100% + 4px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    z-index: 100;
    max-height: 220px;
    overflow-y: auto;
    display: none;
  }

  .ac-list.open { display: block; }

  .ac-item {
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }

  .ac-item:last-child { border-bottom: none; }
  .ac-item:hover, .ac-item.highlighted { background: var(--accent-light); }

  .ac-cp {
    font-weight: 600;
    color: var(--accent-text);
    font-size: 13px;
    min-width: 50px;
    font-variant-numeric: tabular-nums;
  }

  .ac-city { color: var(--text); }
  .ac-dept { color: var(--text-3); font-size: 12px; margin-left: auto; }

  .btn-primary {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 1rem;
  }

  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }

  .result-area {
    display: none;
    margin-top: 1.25rem;
  }

  .result-area.visible { display: block; }

  .result-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .result-text {
    display: block;
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
    font-size: 15px;
    font-family: inherit;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    resize: none;
    overflow: hidden;
    min-height: 120px;
    outline: none;
  }

  .result-text:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79, 127, 255, 0.12);
  }

  .result-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .btn-sm {
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-2);
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }

  .btn-sm:hover { background: var(--surface2); color: var(--text); }

  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    display: inline-block;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .hint {
    font-size: 13px;
    color: var(--text-3);
    margin-top: 6px;
  }

  .section-divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 1.25rem 0;
    color: var(--text-3);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .section-divider::before, .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* select option style fallback */
  select option { background: var(--surface); color: var(--text); }
</style>
</head>
<body>

<main>
  <h1>Générateur d'annonces</h1>
  <p class="subtitle">Crée une annonce pour les transporteurs en quelques secondes.</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('form')" id="tab-form">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      Formulaire
    </button>
    <button class="tab" onclick="switchTab('text')" id="tab-text">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Texte libre
    </button>
  </div>

  <!-- FORM PANEL -->
  <div id="panel-form" class="panel active">
    <div class="card">
      <div class="row2">
        <div class="field">
          <label>Départ</label>
          <div class="ac-wrap">
            <input type="text" id="f-depart" placeholder="CP ou ville…" autocomplete="off" oninput="acSearch(this,'ac-depart')" onkeydown="acKeydown(event,'ac-depart','f-depart')" />
            <div class="ac-list" id="ac-depart"></div>
          </div>
        </div>
        <div class="field">
          <label>Arrivée</label>
          <div class="ac-wrap">
            <input type="text" id="f-arrivee" placeholder="CP ou ville…" autocomplete="off" oninput="acSearch(this,'ac-arrivee')" onkeydown="acKeydown(event,'ac-arrivee','f-arrivee')" />
            <div class="ac-list" id="ac-arrivee"></div>
          </div>
        </div>
      </div>
      <div class="row3">
        <div class="field">
          <label>Colisage</label>
          <input type="text" id="f-colisage" placeholder="ex. 3 palettes" />
        </div>
        <div class="field">
          <label>Dimensions</label>
          <input type="text" id="f-dims" placeholder="ex. 120×80×100" />
        </div>
        <div class="field">
          <label>Poids</label>
          <input type="text" id="f-poids" placeholder="ex. 450 kg" />
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Chargement (date / créneau)</label>
          <div class="date-wrap">
            <input type="text" id="f-date" placeholder="ex. Mardi 8h-12h" />
            <input type="date" class="date-pick" aria-label="Choisir une date" onchange="applyPickedDate(this,'f-date')" />
          </div>
        </div>
        <div class="field">
          <label>Livraison (date / créneau)</label>
          <div class="date-wrap">
            <input type="text" id="f-livraison" placeholder="ex. Mercredi avant 17h" />
            <input type="date" class="date-pick" aria-label="Choisir une date" onchange="applyPickedDate(this,'f-livraison')" />
          </div>
        </div>
      </div>
      <div class="field">
        <label>Contraintes</label>
        <input type="text" id="f-contraintes" placeholder="ex. hayon, urgent, ADR" />
      </div>
    </div>
    <div class="generate-row">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="fr" onclick="setLang('fr')">🇫🇷 FR</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
      </div>
      <button class="btn-primary" onclick="generateFromForm()" id="btn-form">
        Générer l'annonce
      </button>
    </div>
  </div>

  <!-- TEXT PANEL -->
  <div id="panel-text" class="panel">
    <div class="card">
      <div class="field">
        <label>Colle un email, une fiche ou un message</label>
        <textarea id="t-input" placeholder="Ex : Besoin d'un transport Rennes → Paris pour 3 palettes de 400 kg, enlèvement lundi avant 10h, livraison avant 17h…"></textarea>
        <p class="hint">L'IA extrait les informations et formate l'annonce automatiquement.</p>
      </div>
    </div>
    <div class="generate-row">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="fr" onclick="setLang('fr')">🇫🇷 FR</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">🇬🇧 EN</button>
      </div>
      <button class="btn-primary" onclick="generateFromText()" id="btn-text">
        Extraire et générer
      </button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result-area" class="result-area">
    <div class="section-divider">Résultat</div>
    <textarea class="result-text" id="result-text"></textarea>
    <div class="result-actions">
      <button class="btn-sm" onclick="copyResult()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copier
      </button>
      <button class="btn-sm" onclick="regenerate()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Reformuler
      </button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
let currentLang = 'fr';
let lastPrompt = '';

/* ── LANG ── */
function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

/* ── DATE PICKER ── */
function applyPickedDate(dateInput, textInputId) {
  const val = dateInput.value;
  if (!val) return;
  const [, m, d] = val.split('-');
  const textInput = document.getElementById(textInputId);
  textInput.value = `${d}/${m}` + (textInput.value ? ' ' + textInput.value : '');
  dateInput.value = '';
  textInput.focus();
}

/* ── TABS ── */
function switchTab(tab) {
  ['form','text'].forEach(t => {
    document.getElementById('panel-' + t).classList.toggle('active', t === tab);
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
  });
  document.getElementById('result-area').classList.remove('visible');
}

/* ── AUTOCOMPLETE VILLE/CP MONDE (Nominatim/OpenStreetMap) ── */
let acTimers = {};

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

async function acSearch(input, listId) {
  const q = input.value.trim();
  const list = document.getElementById(listId);
  clearTimeout(acTimers[listId]);
  if (q.length < 2) { list.classList.remove('open'); return; }

  acTimers[listId] = setTimeout(async () => {
    try {
      const isNum = /^\d/.test(q);
      const param = isNum ? `postalcode=${encodeURIComponent(q)}` : `q=${encodeURIComponent(q)}`;
      const res = await fetch(`https://nominatim.openstreetmap.org/search?${param}&format=json&addressdetails=1&limit=8`);
      const data = await res.json();
      if (!data.length) { list.classList.remove('open'); return; }

      const items = data
        .map(d => {
          const addr = d.address || {};
          const nom = addr.city || addr.town || addr.village || addr.municipality || addr.county || (d.display_name || '').split(',')[0];
          const cp = addr.postcode || '';
          const country = (addr.country_code || '').toUpperCase();
          return { cp, nom, country };
        })
        .filter(it => it.nom);

      list.innerHTML = items.map(it =>
        `<div class="ac-item" data-val="${escapeHtml(`${it.country}${it.cp} ${it.nom}`.trim())}">
          <span class="ac-cp">${escapeHtml(it.country + it.cp)}</span>
          <span class="ac-city">${escapeHtml(it.nom)}</span>
          <span class="ac-dept">${escapeHtml(it.country)}</span>
        </div>`
      ).join('');
      list.querySelectorAll('.ac-item').forEach(el => {
        el.addEventListener('click', () => selectAC(listId, input.id, el.dataset.val));
      });
      list.classList.add('open');
    } catch(e) {}
  }, 280);
}

function selectAC(listId, inputId, val) {
  document.getElementById(inputId).value = val;
  document.getElementById(listId).classList.remove('open');
}

function acKeydown(e, listId, inputId) {
  const list = document.getElementById(listId);
  const items = list.querySelectorAll('.ac-item');
  const cur = list.querySelector('.highlighted');
  if (e.key === 'Escape') { list.classList.remove('open'); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const next = cur ? cur.nextElementSibling : items[0];
    if (cur) cur.classList.remove('highlighted');
    if (next) next.classList.add('highlighted');
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    const prev = cur ? cur.previousElementSibling : null;
    if (cur) cur.classList.remove('highlighted');
    if (prev) prev.classList.add('highlighted');
  } else if (e.key === 'Enter') {
    if (cur) { selectAC(listId, inputId, cur.dataset.val); e.preventDefault(); }
  }
}

document.addEventListener('click', e => {
  document.querySelectorAll('.ac-list').forEach(l => {
    if (!l.parentElement.contains(e.target)) l.classList.remove('open');
  });
});

document.getElementById('result-text').addEventListener('input', e => autoGrow(e.target));

/* ── AI CALL ── */
async function callClaude(userPrompt) {
  lastPrompt = userPrompt;
  const result = document.getElementById('result-area');
  const box = document.getElementById('result-text');
  result.classList.remove('visible');

  const langInstruction = currentLang === 'fr'
    ? 'Rédige la dernière ligne (contraintes/instructions) en français.'
    : 'Write the last line (constraints/instructions) in English. Write "tomorrow" in full, never abbreviate it as "tmrw".';

  const now = new Date();
  const weekdayFr = now.toLocaleDateString('fr-FR', { weekday: 'long' });
  const weekdayEn = now.toLocaleDateString('en-US', { weekday: 'long' });
  const dateContext = `Date du jour : ${now.toISOString().slice(0, 10)}, ${weekdayFr} (${weekdayEn} en anglais).`;

  const system = `Tu es un assistant pour un affréteur de transport express B2B.
Tu génères des annonces ultra-courtes et codées pour proposer des missions aux transporteurs.

${dateContext}

Format strict, exactement 4 lignes, sans emoji, sans phrase, sans bonjour ni politesse :
Ligne 1 : [Code pays ISO2][Code postal] [Ville de départ]
Ligne 2 : [Code pays ISO2][Code postal] [Ville d'arrivée]
Ligne 3 : [Nombre] [type de colisage] [Longueur]*[Largeur]*[Hauteur] / [Poids]kg
Ligne 4 : contraintes/instructions en abrégé, incluant le créneau de chargement et/ou de livraison si fournis (enlèvement, livraison, particularités)

Le [type de colisage] doit reprendre exactement ce que l'utilisateur a indiqué (ex. "pals", "palettes", "colis", "cartons"), sans le remplacer par un autre mot. Si rien n'est précisé, utilise "colis".

Les dimensions [Longueur]*[Largeur]*[Hauteur] doivent toujours être séparées par "*", quel que soit le séparateur utilisé par l'utilisateur en entrée (x, ×, /, -, espace…). N'utilise jamais "/" entre les dimensions : ce caractère est réservé uniquement à la séparation entre les dimensions et le poids, pour éviter toute confusion.

Gestion des dates de chargement/livraison sur la ligne 4 : calcule d'abord la date calendaire réelle correspondant au jour ou à la date indiqués, en te basant sur la date du jour ci-dessus (ex. si on est lundi et que l'utilisateur écrit "mardi", la date calendaire réelle est le lendemain).
- Si cette date correspond au jour même, écris "today" (anglais) / "aujourd'hui" (français).
- Si cette date correspond au lendemain (jour calendaire suivant), écris "tomorrow" (anglais) / "demain" (français).
- Pour toute autre date (ni aujourd'hui ni demain), écris toujours la date au format JJ/MM (ex. "26/06"), jamais le nom du jour, même si l'utilisateur a fourni un nom de jour plutôt qu'une date.

Règle générale très importante : n'affiche jamais de placeholder (ex. "/ -", "N/A", "?") pour une information manquante. Toute donnée absente (poids, dimensions, contraintes, etc.) doit simplement être retirée de la ligne concernée, sans laisser de trace (espace, séparateur "/" ou ponctuation orpheline). Si toute la ligne 4 est sans objet (aucune contrainte/instruction fournie), supprime entièrement la ligne 4 plutôt que de la laisser vide ou inventée.

Exemple (Paris → Rennes) :
FR75001 Paris
FR35000 Rennes
3 pals 75*100*110 / 10kg
load asap, direct del

("load asap, direct del" signifie : enlèvement au plus vite, livraison directe sans transit.)
Utilise des abréviations courtes et efficaces sur la ligne 4 (asap, direct del, hayon, ADR, etc.).

Lexique transport FR → EN à respecter quand la ligne 4 est en anglais : "20m3 débachable" → "20m3 curtain side" (idem pour les autres tonnages, ex. "90m3 débachable" → "90m3 curtain side").
${langInstruction}`;

  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        max_tokens: 400,
        system,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    const text = data.content?.map(b => b.text || '').join('') || '';
    box.value = text.trim();
    result.classList.add('visible');
    autoGrow(box);
  } catch(e) {
    box.value = '❌ Erreur : ' + e.message;
    result.classList.add('visible');
    autoGrow(box);
  }
}

function autoGrow(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = textarea.scrollHeight + 'px';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Génération…';
  } else {
    btn.disabled = false;
    btn.innerHTML = btnId === 'btn-form' ? 'Générer l\'annonce' : 'Extraire et générer';
  }
}

async function generateFromForm() {
  const depart = document.getElementById('f-depart').value.trim();
  const arrivee = document.getElementById('f-arrivee').value.trim();
  if (!depart || !arrivee) { showToast('Départ et arrivée requis'); return; }
  const fields = {
    Départ: depart, Arrivée: arrivee,
    Colisage: document.getElementById('f-colisage').value.trim(),
    Dimensions: document.getElementById('f-dims').value.trim(),
    Poids: document.getElementById('f-poids').value.trim(),
    Chargement: document.getElementById('f-date').value.trim(),
    Livraison: document.getElementById('f-livraison').value.trim(),
    Contraintes: document.getElementById('f-contraintes').value.trim()
  };
  const prompt = Object.entries(fields).filter(([,v]) => v).map(([k,v]) => `${k} : ${v}`).join('\n');
  setLoading('btn-form', true);
  await callClaude('Génère une annonce transport :\n' + prompt);
  setLoading('btn-form', false);
}

async function generateFromText() {
  const input = document.getElementById('t-input').value.trim();
  if (!input) { showToast('Colle un texte d\'abord'); return; }
  setLoading('btn-text', true);
  await callClaude('Extrais les infos et génère une annonce transport :\n\n' + input);
  setLoading('btn-text', false);
}

async function regenerate() {
  if (!lastPrompt) return;
  const activeBtn = document.querySelector('.panel.active .btn-primary');
  const btnId = activeBtn ? activeBtn.id : 'btn-form';
  setLoading(btnId, true);
  await callClaude(lastPrompt);
  setLoading(btnId, false);
}

function copyResult() {
  navigator.clipboard.writeText(document.getElementById('result-text').value).then(() => showToast('✓ Copié !'));
}

/* ── TOAST ── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
</script>
